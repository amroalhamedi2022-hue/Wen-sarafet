name: Wen Sarafet sandbox real-screen emulator smoke
on:
  pull_request:
    paths:
      - 'app/**'
      - 'glass-engine/**'
      - 'tools/wen_sandbox_smoke.sh'
      - 'tools/check_nav_lens_pixels.py'
      - '.github/workflows/wen-full-sandbox-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wen-sandbox-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-sandbox-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: KVM on runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile full finance sandbox
        run: gradle :app:assembleSandbox --no-daemon --console=plain
      - name: Boot Android and launch actual app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Automated headless Android image avoids unrelated Pixel Launcher ANR modal.
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/wen_sandbox_smoke.sh
      - name: Collect safe synthetic runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wen-full-sandbox-actual-screens
          path: app/sandbox-smoke-results/*
          retention-days: 7
          if-no-files-found: warn
