name: Wen 2.0 Premium Liquid Glass Safe Zone review
on:
  pull_request:
    branches:
      - fix/wen-contact-picker-xiaomi-20261101
    paths:
      - 'app/**'
      - 'glass-engine/**'
      - 'settings.gradle'
      - 'tests/wen_188_visual_safezone_contract.py'
      - '.github/workflows/wen-188-visual-safe-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard exact 1.8.8 business-source and original callbacks
        run: |
          python3 tests/wen_211_integrated_offline_visual_contract.py
          python3 tests/financial_safe_zone_guard.py
      - name: Run original finance, debt, migration and security tests
        run: bash scripts/test_core.sh
      - name: Test approved split auto-remainder in exact monetary units
        run: |
          mkdir -p build/split-remainder-test
          javac -encoding UTF-8 -d build/split-remainder-test \
            app/src/main/java/app/wensarafet/tracker/Money.java \
            app/src/main/java/app/wensarafet/tracker/SplitRemainderRules.java \
            tests/SplitRemainderRulesTest.java
          java -cp build/split-remainder-test SplitRemainderRulesTest
      - name: Install SDK 35
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile visual trial and original unsigned release; lint
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug --no-daemon --console=plain
      - name: Verify original APK identity and reject new permissions
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='app.wensarafet.tracker' versionCode='28' versionName='2.0'"
          "$AAPT" dump permissions "$APK" > /tmp/wen-188-visual-permissions.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path("/tmp/wen-188-visual-permissions.txt").read_text()
          actual=set(re.findall(r"uses-permission:\s+name='([^']+)'",text))
          expected={
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_SMS",
              "android.permission.USE_BIOMETRIC",
          }
          assert actual == expected, f"SAFE ZONE: unexpected APK permissions {sorted(actual ^ expected)}"
          print("PASS: 2.0 package/version and exact offline permission set")
          PY
          sha256sum "$APK"
      - name: Upload original-package unsigned visual review
        uses: actions/upload-artifact@v4
        with:
          name: wen-190-reference-glass-UNSIGNED-not-for-install
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload isolated test package (never production updater)
        uses: actions/upload-artifact@v4
        with:
          name: wen-190-reference-glass-DEBUG-only
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
