name: Dark Crystal Widget Sandbox — real Android RemoteViews screenshot
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/sandbox-crystal-widget-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Android x86_64 emulator cannot install ARM-only nativegauss.so.
      # Suppress native optics ONLY in ephemeral test workspace.
      - name: Exclude ARM-only native library from emulator-only package
        run: |
          cat >> app/build.gradle <<'GRADLE'
          android {
              packagingOptions {
                  jniLibs { excludes += ['**/libnativegauss.so'] }
              }
          }
          GRADLE
      - name: Source-only widget and golden frame-budget regression
        run: python3 tests/wen_widget_fab_gold_optics_contract.py
      - name: Compile visual sandbox
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: KVM permissions
        run: |
          if test -e /dev/kvm; then sudo chmod 0666 /dev/kvm; fi
      - name: Inflate actual RemoteViews and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disk-size: 1536M
          sdcard-path-or-size: 128M
          emulator-boot-timeout: 600
          script: >-
            bash -lc 'mkdir -p build/widget-review && adb install -r app/build/outputs/apk/debug/app-debug.apk && adb shell am start -n app.wensarafet.tracker.sandbox/app.wensarafet.tracker.WidgetPreviewActivity && sleep 12 && adb shell screencap -p /sdcard/widget-preview.png && adb pull /sdcard/widget-preview.png build/widget-review/widget-preview-api${{ matrix.api-level }}.png && adb shell am start -n app.wensarafet.tracker.sandbox/app.wensarafet.tracker.MainActivity && sleep 6 && adb shell screencap -p /sdcard/main-fab.png && adb pull /sdcard/main-fab.png build/widget-review/main-fab-api${{ matrix.api-level }}.png && adb shell input swipe 470 880 470 410 600 && sleep 1 && adb shell screencap -p /sdcard/scrolled-fab.png && adb pull /sdcard/scrolled-fab.png build/widget-review/scrolled-fab-api${{ matrix.api-level }}.png && adb shell am force-stop app.wensarafet.tracker.sandbox && adb shell am start -n app.wensarafet.tracker.sandbox/app.wensarafet.tracker.WidgetPreviewActivity --ei preview_theme_index 27 && sleep 8 && adb shell screencap -p /sdcard/champagne-fab.png && adb pull /sdcard/champagne-fab.png build/widget-review/champagne-fab-api${{ matrix.api-level }}.png && adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|RemoteViews.*(Error|Exception)|AndroidRuntime" | tail -40 > build/widget-review/errors.txt || true'
      - name: Upload actual emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-crystal-v22-real-remoteviews-api${{ matrix.api-level }}
          path: build/widget-review/
          if-no-files-found: warn
          retention-days: 7
