name: Wen Sarafet unsigned original-package release candidate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'proguard-rules.pro'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/unsigned-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-package-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 from preinstalled runner tools
        run: |
          test -n "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build MINIFIED UNSIGNED release with original applicationId (never use signing keys on CI)
        run: gradle :app:assembleRelease --no-daemon --console=plain
      - name: Verify original package, next version, alignment and non-debuggable release
        run: |
          set -euo pipefail
          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="build/unsigned/Wen-Sarafet-1.8.3-aligned-UNSIGNED.apk"
          test -s "$INPUT"
          mkdir -p build/unsigned
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -P 16 -v 4 "$INPUT" "$OUTPUT"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$OUTPUT"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUTPUT")"
          grep -Fq "package: name='app.wensarafet.tracker' versionCode='19' versionName='1.8.3'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUTPUT" | head -4
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$OUTPUT" AndroidManifest.xml | grep -Eq 'android:debuggable.*0xffffffff'; then
            echo 'ERROR: release is debuggable' >&2
            exit 1
          fi
          sha256sum "$OUTPUT"
          echo "UNSIGNED aligned candidate only; owner signs privately after independent signer check."
      - name: Stage Android SDK APK signature verification utility
        run: |
          mkdir -p build/release-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/release-tools/apksigner.jar
      - name: Upload Android SDK public signature utility
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-apksigner-tool
          path: build/release-tools/apksigner.jar
          retention-days: 2
          if-no-files-found: error
      - name: Upload UNSIGNED original application package for private offline signing
        uses: actions/upload-artifact@v4
        with:
          name: wen-1-8-3-original-package-unsigned
          path: build/unsigned/Wen-Sarafet-1.8.3-aligned-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 2
