name: Wen Sarafet Android debug compile (unsigned release-safe)

on:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub's Ubuntu runner
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Provide Gradle 8.10.2 without a project wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug app (never use as 1.8.0 upgrade)
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: Verify debug artifact
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          echo 'Debug applicationId has suffix .recovered.debug: this is NOT a signed production upgrade.'
      - name: Publish short-lived debug compilation evidence
        uses: actions/upload-artifact@v4
        with:
          name: wen-sarafet-debug-compile-only
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
