name: Core rules tests (no APK build)
on:
  push:
    branches: ["feature/wen-batch01-recovered-20261024"]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test isolated finance rules
        run: |
          mkdir -p /tmp/wen-core
          javac --release 17 -encoding UTF-8 -d /tmp/wen-core \
            app/src/main/java/app/wensarafet/tracker/CategorySuggestionRules.java \
            app/src/main/java/app/wensarafet/tracker/FxTransferMath.java \
            tests/CategorySuggestionRulesTest.java \
            tests/FxTransferMathTest.java
          java -cp /tmp/wen-core CategorySuggestionRulesTest
          java -cp /tmp/wen-core FxTransferMathTest
