name: Wen Sarafet source-only finance and safety checks
on:
  push:
    branches:
      - 'feature/wen-batch01-recovered-20261024'
      - 'feature/wen-batch02-finance-ui-20261024'
      - 'feature/wen-batch03-fx-daily-20261025'
      - 'feature/wen-batch04-debt-splits-20261025'
      - 'feature/wen-batch05-undo-20261025'
  pull_request:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Java business-rule and SQL migration tests (no APK)
        run: bash scripts/test_core.sh
      - name: Check protected security file digests remain identical to recovered baseline
        run: sha256sum -c tests/protected_security_sha256.txt
