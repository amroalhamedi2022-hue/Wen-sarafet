name: Wen Sarafet source-only finance and safety checks
on:
  push:
    branches:
      - 'feature/wen-*'
      - 'automation/wen-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Java business-rule and SQL migration tests (no APK)
        run: bash scripts/test_core.sh
      - name: Test genuine Android screenshot integrity without an emulator
        run: |
          python3 -m unittest discover -s tests -p test_native_capture_integrity.py -v
          bash -n scripts/capture_main_no_instrumentation.sh
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -NonInteractive -Command '$tokens=$null; $parseErrors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/capture_owner_android_device.ps1",[ref]$tokens,[ref]$parseErrors) | Out-Null; if ($parseErrors.Count -gt 0) { $parseErrors | Out-String | Write-Host; exit 1 }'
          else
            echo "PowerShell unavailable on runner: device helper syntax check skipped"
          fi
      - name: Check protected security file digests remain identical to recovered baseline
        run: sha256sum -c tests/protected_security_sha256.txt
      - name: Validate Android XML, manifest permissions and public repository hygiene
        run: python3 tests/source_repository_guard.py
      - name: Run recovered-source audit and parse release scripts (no signing secrets)
        run: |
          bash -n scripts/audit_recovered_source.sh scripts/audit_release.sh scripts/build_apk.sh scripts/verify_upgrade_apk.sh scripts/sign_verified_upgrade.sh
          CORE_TESTS_ALREADY_RUN=1 bash scripts/audit_recovered_source.sh
