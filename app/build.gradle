plugins { id "com.android.application" }

android {
    namespace "app.wensarafet.tracker"
    compileSdk 35

    defaultConfig {
        applicationId "app.wensarafet.tracker"
        minSdk 33
        targetSdk 35
        versionCode 29
        versionName "2.1"
        // Test APK only; the release applicationId, permissions and signing stay identical.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (System.getenv("WEN_SARAFET_KEYSTORE")) {
            release {
                storeFile file(System.getenv("WEN_SARAFET_KEYSTORE"))
                storePassword System.getenv("WEN_SARAFET_STORE_PASSWORD")
                keyAlias System.getenv("WEN_SARAFET_KEY_ALIAS") ?: "wen-sarafet-test"
                keyPassword System.getenv("WEN_SARAFET_KEY_PASSWORD") ?: System.getenv("WEN_SARAFET_STORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Production APK must not be debuggable, even though debug builds are.
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), rootProject.file("proguard-rules.pro")
            if (signingConfigs.findByName("release")) signingConfig signingConfigs.release
        }
        debug { applicationIdSuffix ".recovered.debug" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Android-only visual module: no repository access or finance logic.
    implementation project(":glass-engine")
    // MIT-licensed native navigation optics; UI rendering only (no permissions).
    implementation "com.github.QWEA0:liquidglass:v2.0.11"
    // Android tests only: none of these dependencies enter the production APK.
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
