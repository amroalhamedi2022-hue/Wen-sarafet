plugins { id "com.android.application" }

android {
    namespace "app.wensarafet.tracker"
    compileSdk 35

    defaultConfig {
        applicationId "app.wensarafet.tracker"
        minSdk 33
        targetSdk 35
        versionCode 24
        versionName "1.8.8"
    }

    signingConfigs {
        if (System.getenv("WEN_SARAFET_KEYSTORE")) {
            release {
                storeFile file(System.getenv("WEN_SARAFET_KEYSTORE"))
                storePassword System.getenv("WEN_SARAFET_STORE_PASSWORD")
                keyAlias System.getenv("WEN_SARAFET_KEY_ALIAS") ?: "wen-sarafet-test"
                keyPassword System.getenv("WEN_SARAFET_KEY_PASSWORD") ?: System.getenv("WEN_SARAFET_STORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Production APK must not be debuggable, even though debug builds are.
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), rootProject.file("proguard-rules.pro")
            if (signingConfigs.findByName("release")) signingConfig signingConfigs.release
        }
        debug { applicationIdSuffix ".recovered.debug" }
        sandbox {
            initWith debug
            applicationIdSuffix ".sandbox"
            versionNameSuffix "-sandbox"
            matchingFallbacks = ["debug"]
            debuggable true
        }
    }

    // CI emulator only: QWEA0 publishes ARM native acceleration, but the
    // Android automated-test-device runs x86_64. Run AGSL GPU optics without
    // optional JNI in CI; never remove ARM native libraries from phone APKs.
    if (project.hasProperty("wenEmulatorNoNative")) {
        packagingOptions {
            jniLibs { excludes += ["**/*.so"] }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Android-only visual module: no repository access or finance logic.
    implementation project(":glass-engine")
    // Experiment ONLY: proven Android Views optical library; never ship in production.
    // MIT: https://github.com/QWEA0/Liquid-Glass-Android/blob/v2.0.11/LICENSE
    sandboxImplementation "com.github.QWEA0:liquidglass:v2.0.11"
}
